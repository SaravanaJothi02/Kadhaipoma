<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register Page</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="flex">
        <div class="register-container flex b">
            <h2>Register</h2>
            <form>
                <div class="input-field b">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="email"
                        aria-label="Email"
                    />
                </div>
                <div class="input-field b">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="username"
                        aria-label="Username"
                    />
                </div>
                <div class="input-field b">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="password"
                        aria-label="Password"
                    />
                </div>
                <div class="input-field b">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        name="confirm-password"
                        id="confirm-password"
                        placeholder="confirm password"
                        aria-label="Confirm Password"
                    />
                </div>
                <div class="input-field otp-field b" style="display: none;">
                    <label for="otp">OTP</label>
                    <input type="text" name="otp" id="otp" placeholder="OTP" aria-label="OTP">
                </div>
                <div class="btn">
                    <button type="button" onclick="getOTP()" id="otp-btn">get OTP</button>
                    <button type="submit" onclick="register()" id="register-btn" disabled>register</button>
                </div>
            </form>
            <p id="register">
                <a href="../login/index.html">login</a>
            </p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
